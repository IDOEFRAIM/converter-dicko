# =====================================================================
#  Orchestration complete : PostgreSQL + backend + frontend.
#
#  - postgres  : base de donnees (volume nomme, persistant).
#  - backend   : API Spring Boot (Flyway migre le schema au demarrage).
#  - frontend  : Angular compile, servi par nginx, qui relaie /api -> backend.
#
#  Usage dev (local, tous les ports exposes) :
#    cp .env.example .env
#    docker compose up -d --build
#
#  Usage prod (ports interne, Caddy en reverse-proxy) :
#    cp .env.example .env && vim .env  # renseigner secrets prod
#    COMPOSE_ENV=prod docker compose up -d --build
#
#  Runbook complet de mise en production : voir DEPLOY.md a la racine.
#
#  Profils :
#  - dev (defaut)  : identifiants locaux de application-dev.yml, tous ports publics
#  - prod (COMPOSE_ENV=prod) : secrets obligatoires, PostgreSQL/backend non exposes
# =====================================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: converter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-converter}
      POSTGRES_USER: ${POSTGRES_USER:-converter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-converter_local_dev}
    # Dev : expose le port 5432 pour acces local direct via override.
    # Prod : port non expose (internal networking only).
    volumes:
      - converter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-converter} -d ${POSTGRES_DB:-converter}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - converter-net
    # Prod : limites de ressources (optionnel, ajuster selon VM Hetzner)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 1G
    #     reservations:
    #       memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: converter-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-converter}
      DB_USERNAME: ${POSTGRES_USER:-converter}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-converter_local_dev}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-43200}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4300}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-true}
      ADMIN_PHONE: ${ADMIN_PHONE:-+22500000000}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-System}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Administrator}
      SERVER_PORT: 8080
      # Prod: JWT_SECRET et ADMIN_PASSWORD doivent etre definis dans .env
      JWT_SECRET:
      ADMIN_PASSWORD:
    volumes:
      - converter-storage:/app/storage
    # Dev : expose pour tests directs. Prod : non expose (acces via frontend/nginx seul).
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - converter-net
    # Prod : limites de ressources
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: converter-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Prod: expose SEULEMENT en dev local. En prod, Caddy reverse-proxy depuis 443.
    ports:
      - "${FRONTEND_PORT:-4300}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - converter-net
    # Prod : limites de ressources
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 512M
    #     reservations:
    #       memory: 256M

volumes:
  converter-postgres-data:
    name: converter-postgres-data
  converter-storage:
    name: converter-storage

networks:
  converter-net:
    name: converter-net
    driver: bridge
