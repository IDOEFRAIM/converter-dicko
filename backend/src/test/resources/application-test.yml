# =====================================================================
#  Profil de test — utilise par tous les tests d'integration
#  (@ActiveProfiles("test")).
#
#  La cle JWT et les identifiants de base de donnees ci-dessous ne sont
#  pas des secrets : ce sont des valeurs locales, propres a l'execution
#  des tests, sans aucune portee en dehors de la machine qui les fait
#  tourner. `spring.datasource.url` est de toute facon ecrase a chaud
#  par chaque test via @DynamicPropertySource, avec l'URL reelle du
#  conteneur PostgreSQL demarre par Testcontainers.
# =====================================================================

app:
  jwt:
    secret: test-only-signing-key-not-for-production-use-please-1234567890
    expiration-minutes: 120
  admin-seed:
    enabled: false
  cors:
    allowed-origins: http://localhost:4200
  # Le contexte Spring et donc RateLimitFilter (et son cache Caffeine) sont
  # partages par TOUTE la suite d'integration (voir AbstractIntegrationTest) :
  # un seuil de production realiste serait probablement depasse par le seul
  # volume cumule des tests existants (tous les appels HTTP de test partagent
  # la meme IP 127.0.0.1), ce qui ferait echouer des tests sans rapport avec
  # cette fonctionnalite. La logique du filtre est verifiee isolement par
  # RateLimitFilterTest (test unitaire, sans contexte Spring) ; ces seuils
  # tres eleves servent uniquement a neutraliser la fonctionnalite pour le
  # reste de la suite d'integration.
  abuse-protection:
    register-max-attempts: 100000
    register-window-minutes: 1
    write-max-attempts: 100000
    write-window-minutes: 1

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    org.hibernate.SQL: WARN
