# =====================================================================
#  Configuration commune a tous les profils.
#
#  Aucune valeur sensible ici. Les secrets sont fournis par variables
#  d'environnement et n'ont AUCUNE valeur par defaut en profil `prod` :
#  l'application refuse alors de demarrer plutot que de tourner avec
#  une configuration devinee.
# =====================================================================

spring:
  application:
    name: converter-backend

  # Profil utilise lorsqu'aucun profil actif n'est fourni.
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/converter}
    username: ${DB_USERNAME:converter}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: converter-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000

  jpa:
    # `validate` et jamais `create` / `update` : Flyway est le seul
    # maitre du schema. Toute divergence entite / migration fait
    # echouer le demarrage, ce qui est le comportement voulu.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  error:
    # Aucune stack trace ne doit fuir vers le client.
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # "metrics" ajoute (audit de fermeture) : Micrometer core est deja
        # present transitivement via spring-boot-starter-actuator, aucune
        # nouvelle dependance (pas de registre Prometheus, non necessaire
        # pour le pilote). Donne a un operateur authentifie une visibilite
        # minimale (distribution des codes HTTP via http.server.requests,
        # sante JVM) sans aucun outil externe. Meme niveau d'exposition que
        # "info" deja present : authentifie, pas necessairement ADMIN (voir
        # SecurityConfig — seul /actuator/health/** est public).
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# =====================================================================
#  Configuration applicative
# =====================================================================
app:
  jwt:
    # OBLIGATOIRE. Aucune valeur par defaut ici : c'est
    # `application-dev.yml` qui fournit une cle de developpement.
    secret: ${JWT_SECRET:}
    # 30 jours (retour client : "quand l'utilisateur sort de l'application, il est encore
    # oblige de rentrer son mot de passe, c'est pas efficace") -- 120 min convenait a un usage
    # continu mais forcait une reconnexion des que l'appli restait fermee plus de deux heures,
    # ce qui est la norme pour une appli de paiement consultee sporadiquement dans la journee.
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:43200}
    issuer: converter-api

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  google:
    # Facultatif : sans valeur, /api/auth/google[/complete] repond 503
    # (GOOGLE_SIGNIN_UNAVAILABLE) au lieu d'empecher tout le service de
    # demarrer -- voir GoogleAuthProperties. Client ID Web OAuth 2.0, cree
    # dans Google Cloud Console (Identifiants -> ID client OAuth -> Web) ;
    # c'est aussi la valeur attendue comme "Server Client ID" par le SDK
    # Google Sign-In cote mobile (meme Client ID des deux cotes).
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

  push:
    # Facultatif : sans valeur, GET /api/v1/push/config repond available=false et le frontend
    # masque toute UI d'activation, au lieu d'empecher le service de demarrer -- voir
    # PushProperties/PushNotificationSender. Paire de cles VAPID (RFC 8292), generee une seule
    # fois par deploiement (ex. `npx web-push generate-vapid-keys`) : publicKey est envoyee telle
    # quelle au navigateur, jamais un secret ; privateKey signe les envois au nom de ce serveur.
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:support@yuanpay.space}

  transfi:
    # Integration TransFi BizPay, Phase 1 -- desactivee par defaut, voir TransFiProperties et
    # docs/TRANSFI_INTEGRATION.md. `enabled` est une bascule SEPAREE des identifiants : meme
    # renseignes, l'integration reste inactive tant que TRANSFI_ENABLED n'est pas explicitement
    # mis a true. Le flux manuel (SettlementService) reste le chemin par defaut dans tous les cas.
    enabled: ${TRANSFI_ENABLED:false}
    base-url: ${TRANSFI_BASE_URL:}
    client-id: ${TRANSFI_CLIENT_ID:}
    client-secret: ${TRANSFI_CLIENT_SECRET:}
    webhook-secret: ${TRANSFI_WEBHOOK_SECRET:}

  login-protection:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    lock-duration-minutes: ${LOGIN_LOCK_MINUTES:15}

  # Anti-abus/flooding sur l'inscription et les endpoints d'ecriture
  # authentifies les plus exposes (devis, ordre, soumission de paiement).
  # Voir RateLimitFilter : limite de volume par IP, jamais remise a zero
  # par un succes (contrairement a login-protection, qui protege contre le
  # bourrage d'identifiants).
  abuse-protection:
    register-max-attempts: ${ABUSE_REGISTER_MAX_ATTEMPTS:5}
    register-window-minutes: ${ABUSE_REGISTER_WINDOW_MINUTES:15}
    write-max-attempts: ${ABUSE_WRITE_MAX_ATTEMPTS:60}
    write-window-minutes: ${ABUSE_WRITE_WINDOW_MINUTES:5}

  storage:
    # Hors racine web : jamais servi statiquement, uniquement via un
    # endpoint authentifie qui verifie la propriete de la ressource.
    root-dir: ${STORAGE_ROOT_DIR:./storage}

  admin-seed:
    enabled: ${ADMIN_SEED_ENABLED:false}
    phone: ${ADMIN_PHONE:}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:System}
    last-name: ${ADMIN_LAST_NAME:Administrator}

logging:
  # %X{requestId} : identifiant de correlation par requete (voir RequestIdFilter), present dans
  # CHAQUE ligne de log via le seul point d'extension officiellement documente pour enrichir le
  # pattern par defaut de Spring Boot sans le redefinir entierement (moins fragile qu'un pattern
  # console/file complet recopie a la main).
  pattern:
    level: "%5p [%X{requestId}]"
  level:
    root: INFO
    com.converter: INFO
