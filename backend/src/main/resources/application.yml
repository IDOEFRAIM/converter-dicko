# =====================================================================
#  Configuration commune a tous les profils.
#
#  Aucune valeur sensible ici. Les secrets sont fournis par variables
#  d'environnement et n'ont AUCUNE valeur par defaut en profil `prod` :
#  l'application refuse alors de demarrer plutot que de tourner avec
#  une configuration devinee.
# =====================================================================

spring:
  application:
    name: converter-backend

  # Profil utilise lorsqu'aucun profil actif n'est fourni.
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/converter}
    username: ${DB_USERNAME:converter}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: converter-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000

  jpa:
    # `validate` et jamais `create` / `update` : Flyway est le seul
    # maitre du schema. Toute divergence entite / migration fait
    # echouer le demarrage, ce qui est le comportement voulu.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  error:
    # Aucune stack trace ne doit fuir vers le client.
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# =====================================================================
#  Configuration applicative
# =====================================================================
app:
  jwt:
    # OBLIGATOIRE. Aucune valeur par defaut ici : c'est
    # `application-dev.yml` qui fournit une cle de developpement.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    issuer: converter-api

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  login-protection:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    lock-duration-minutes: ${LOGIN_LOCK_MINUTES:15}

  storage:
    # Hors racine web : jamais servi statiquement, uniquement via un
    # endpoint authentifie qui verifie la propriete de la ressource.
    root-dir: ${STORAGE_ROOT_DIR:./storage}

  admin-seed:
    enabled: ${ADMIN_SEED_ENABLED:false}
    phone: ${ADMIN_PHONE:}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:System}
    last-name: ${ADMIN_LAST_NAME:Administrator}

logging:
  level:
    root: INFO
    com.converter: INFO
