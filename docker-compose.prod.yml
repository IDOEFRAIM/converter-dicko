# =====================================================================
#  Overlay OPTIONNEL pour la production (limites de ressources + logging).
#
#  Le fichier docker-compose.yml de base est DEJA prod-safe par defaut :
#  ni PostgreSQL ni le backend ne publient de port sur l'hote. Cet
#  overlay n'a donc PAS besoin de "retirer" des ports (Compose concatene
#  les listes entre fichiers -f, un override `ports: []` ne les retire
#  jamais) -- il ajoute seulement les limites de ressources et une
#  politique de redemarrage plus stricte pour un serveur de production.
#
#  USAGE (Hetzner/staging/prod) :
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
#  Prerequis :
#  1. .env avec les secrets de prod (JWT_SECRET, ADMIN_PASSWORD, POSTGRES_PASSWORD)
#  2. Caddy en reverse-proxy sur 443 -> frontend:4300 (voir Caddyfile.example)
# =====================================================================

services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          memory: 512M

  backend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          memory: 1G

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 256M
