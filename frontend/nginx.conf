# =====================================================================
#  Service statique du frontend Angular + proxy /api vers le backend.
#
#  Le frontend appelle l'API en MEME ORIGINE (`environment.apiBaseUrl = '/api'`) :
#  aucune requete cross-origin cote navigateur, donc aucun preflight CORS en
#  production. nginx relaie `/api/*` vers le conteneur `backend` du reseau
#  Compose.
# =====================================================================

server {
    # IPv4 + IPv6. Le script /docker-entrypoint.d/10-listen-on-ipv6-by-default.sh
    # de l'image nginx ne patche QUE default.conf (supprime ici) : on declare
    # l'ecoute IPv6 nous-memes, sinon un `wget http://localhost/` interne (donc
    # le HEALTHCHECK) peut resoudre ::1 et se voir refuser la connexion.
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression ------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml font/ttf font/otf font/woff font/woff2;

    # ---- En-tetes de securite (document HTML) ----------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API : relais vers le backend Spring Boot -----------------
    #
    # `proxy_pass` avec une VARIABLE (et non un hote litteral) : nginx ne
    # resout alors PAS `backend` au demarrage — il demarre meme si le
    # backend est absent — et re-resout a chaque requete via le DNS
    # embarque de Docker (127.0.0.11), ce qui suit aussi une recreation
    # du conteneur backend (nouvelle IP) sans reload.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Aligne sur spring.servlet.multipart.max-request-size (12 Mo) + marge.
        client_max_body_size 15m;
    }

    # ---- Sonde de sante pratique pour un load-balancer externe ----
    location = /healthz {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $health_upstream http://backend:8080;
        proxy_pass $health_upstream/actuator/health;
        access_log off;
    }

    # ---- index.html : jamais mis en cache ------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # ---- PWA : service worker + manifeste, JAMAIS mis en cache --
    # Sans ces regles, /sw.js tomberait dans le bloc "cache immuable 1 an"
    # ci-dessous : le navigateur ne verrait plus jamais les mises a jour du
    # service worker. Declares AVANT le bloc regex (location exacte `=`
    # prioritaire de toute facon).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ---- Assets versionnes (outputHashing: all) : cache immuable --
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---- SPA : toute autre route -> index.html -------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
