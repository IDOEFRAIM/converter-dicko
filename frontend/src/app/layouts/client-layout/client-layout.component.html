<div class="app-frame">
  @if (!hideAppBar()) {
    <header class="app-bar">
      @if (!isRoot()) {
        <button mat-icon-button type="button" class="app-bar__back" (click)="back()" aria-label="Retour">
          <mat-icon>arrow_back</mat-icon>
        </button>
      }
      <h1 class="app-bar__title">{{ title() }}</h1>
      @if (appBar.actions(); as tpl) {
        <span class="app-bar__custom"><ng-container *ngTemplateOutlet="tpl" /></span>
      }
      @if (action(); as a) {
        <a mat-icon-button [routerLink]="a.link" [attr.aria-label]="a.label" [title]="a.label" class="app-bar__action">
          <mat-icon>{{ a.icon }}</mat-icon>
        </a>
      }
      <a mat-icon-button routerLink="/notifications" aria-label="Notifications" title="Notifications" class="app-bar__action">
        <mat-icon
          fontSet="material-icons-outlined"
          [matBadge]="unreadCount() > 0 ? unreadCount() : null"
          matBadgeColor="warn"
          matBadgeSize="small"
          aria-hidden="false"
        >notifications</mat-icon>
      </a>
    </header>
  }

  <main class="app-body">
    <router-outlet />
  </main>

  <div class="app-dock">
    <div class="app-dock__banner">
      <app-install-banner />
    </div>
    <nav class="nav-bar" aria-label="Navigation principale">
      @for (d of destinations; track d.tab) {
        <a
          [routerLink]="d.link"
          class="nav-bar__item"
          [class.nav-bar__item--active]="activeTab() === d.tab"
          [attr.aria-current]="activeTab() === d.tab ? 'page' : null"
          [attr.aria-label]="d.label"
        >
          <span class="nav-bar__indicator">
            <mat-icon [fontSet]="activeTab() === d.tab ? 'material-icons' : 'material-icons-outlined'">{{ d.icon }}</mat-icon>
          </span>
          <span class="nav-bar__label">{{ d.label }}</span>
        </a>
      }
    </nav>
  </div>
</div>
