<mat-toolbar class="toolbar">
  <span class="toolbar__brand">
    <span class="toolbar__mark"><img src="logo.png" alt="" /></span>
    Converter
  </span>
  <span class="toolbar__spacer"></span>
  <button mat-icon-button [matMenuTriggerFor]="moreMenu" aria-label="Plus" class="toolbar__avatar">
    <mat-icon>apps</mat-icon>
  </button>
  <mat-menu #moreMenu="matMenu">
    <a mat-menu-item routerLink="/rates"><mat-icon>show_chart</mat-icon><span>Historique du taux</span></a>
    <a mat-menu-item routerLink="/rate-alerts"><mat-icon>notifications_active</mat-icon><span>Alertes de taux</span></a>
    <a mat-menu-item routerLink="/wallet"><mat-icon>account_balance_wallet</mat-icon><span>Portefeuille</span></a>
    <a mat-menu-item routerLink="/preferred-rate"><mat-icon>tune</mat-icon><span>Taux preferentiel</span></a>
    <a mat-menu-item routerLink="/business"><mat-icon>business_center</mat-icon><span>Espace pro</span></a>
  </mat-menu>
  <button mat-icon-button routerLink="/notifications" aria-label="Notifications" class="toolbar__avatar">
    <mat-icon [matBadge]="unreadCount() > 0 ? unreadCount() : null" matBadgeColor="warn" matBadgeSize="small">
      notifications
    </mat-icon>
  </button>
  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Menu utilisateur" class="toolbar__avatar">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <div class="user-menu__name">{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</div>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Deconnexion</span>
    </button>
  </mat-menu>
</mat-toolbar>

<nav class="bottom-nav">
  <a routerLink="/dashboard" routerLinkActive="bottom-nav__link--active" class="bottom-nav__link">
    <span class="bottom-nav__icon"><mat-icon>home</mat-icon></span>
    <span>Accueil</span>
  </a>
  <a routerLink="/quote/new" routerLinkActive="bottom-nav__link--active" class="bottom-nav__link">
    <span class="bottom-nav__icon"><mat-icon>swap_horiz</mat-icon></span>
    <span>Envoyer</span>
  </a>
  <a routerLink="/suppliers" routerLinkActive="bottom-nav__link--active" class="bottom-nav__link">
    <span class="bottom-nav__icon"><mat-icon>contacts</mat-icon></span>
    <span>Fournisseurs</span>
  </a>
  <a routerLink="/history" routerLinkActive="bottom-nav__link--active" class="bottom-nav__link">
    <span class="bottom-nav__icon"><mat-icon>history</mat-icon></span>
    <span>Historique</span>
  </a>
</nav>

<main class="content">
  <router-outlet />
</main>
