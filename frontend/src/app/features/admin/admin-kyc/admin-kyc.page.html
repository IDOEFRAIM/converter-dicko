<app-page-header title="Verification d'identite" subtitle="Dossiers KYC en attente d'examen" />

@if (loading()) {
  <div class="loading-row"><mat-spinner diameter="32" /></div>
} @else if (submissions().length === 0) {
  <app-empty-state title="Aucun dossier en attente" />
} @else {
  <table mat-table [dataSource]="submissions()" class="mat-elevation-z1 kyc-table">
    <ng-container matColumnDef="user">
      <th mat-header-cell *matHeaderCellDef>Utilisateur</th>
      <td mat-cell *matCellDef="let row">
        <div class="user-cell">
          <span class="user-name">{{ row.userFullName }}</span>
          <span class="user-phone">{{ row.userPhone }}</span>
        </div>
      </td>
    </ng-container>
    <ng-container matColumnDef="documentType">
      <th mat-header-cell *matHeaderCellDef>Piece</th>
      <td mat-cell *matCellDef="let row">{{ documentLabel[row.documentType] }}</td>
    </ng-container>
    <ng-container matColumnDef="submittedAt">
      <th mat-header-cell *matHeaderCellDef>Soumis le</th>
      <td mat-cell *matCellDef="let row">{{ row.submittedAt | date: 'dd/MM/yyyy HH:mm' }}</td>
    </ng-container>
    <ng-container matColumnDef="files">
      <th mat-header-cell *matHeaderCellDef>Fichiers</th>
      <td mat-cell *matCellDef="let row">
        <button mat-button (click)="viewFile(row, 'front')">
          <mat-icon>badge</mat-icon> Recto
        </button>
        @if (row.hasBack) {
          <button mat-button (click)="viewFile(row, 'back')">
            <mat-icon>flip_to_back</mat-icon> Verso
          </button>
        }
        <button mat-button (click)="viewFile(row, 'selfie')">
          <mat-icon>face</mat-icon> Selfie
        </button>
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button
          mat-button
          color="primary"
          (click)="approve(row)"
          [disabled]="processingId() === row.id"
        >
          Approuver
        </button>
        <button
          mat-button
          color="warn"
          (click)="reject(row)"
          [disabled]="processingId() === row.id"
        >
          Rejeter
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
