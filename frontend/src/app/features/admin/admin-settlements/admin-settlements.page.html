<app-page-header title="Reglements" subtitle="Reglements CNY en attente d'execution" />

@if (loading()) {
  <div class="loading-row"><mat-spinner diameter="32" /></div>
} @else if (settlements().length === 0) {
  <app-empty-state title="Aucun reglement en attente" />
} @else {
  <table mat-table [dataSource]="settlements()" class="mat-elevation-z1 settlements-table">
    <ng-container matColumnDef="beneficiaryFullName">
      <th mat-header-cell *matHeaderCellDef>Beneficiaire</th>
      <td mat-cell *matCellDef="let row">{{ row.beneficiaryFullName }}</td>
    </ng-container>
    <ng-container matColumnDef="method">
      <th mat-header-cell *matHeaderCellDef>Methode</th>
      <td mat-cell *matCellDef="let row">{{ row.method }}</td>
    </ng-container>
    <ng-container matColumnDef="amountCny">
      <th mat-header-cell *matHeaderCellDef>Montant</th>
      <td mat-cell *matCellDef="let row">{{ row.amountCny | money: 'CNY' }}</td>
    </ng-container>
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Cree le</th>
      <td mat-cell *matCellDef="let row">{{ row.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <a mat-button color="primary" [routerLink]="['/admin/settlements', row.id]">Executer</a>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
