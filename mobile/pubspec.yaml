  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Polices de marque — Lot E (« Le Comptoir »). Câblé mais INACTIF : décommenter
  # ce bloc UNIQUEMENT après avoir déposé les .ttf dans assets/fonts/ ET basculé
  # displayFontFamily / figureFontFamily dans lib/core/theme/app_typography.dart.
  # Procédure complète : assets/fonts/README.md. On n'ajoute pas `google_fonts`
