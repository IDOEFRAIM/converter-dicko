name: mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+4

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Navigation declarative avec routes nommees, params et redirection (garde d'auth) —
  # correspond au modele mental du routing Angular deja utilise cote web (section 45).
  go_router: ^14.6.2

  # Client HTTP avec intercepteurs (auth, erreurs, timeouts) — equivalent Dio des
  # HttpInterceptorFn Angular (auth.interceptor.ts / error.interceptor.ts).
  dio: ^5.7.0

  # Stockage du jeton JWT dans le Keychain (iOS) / Keystore (Android) — jamais en
  # clair, contrairement au localStorage utilise cote web (section 15).
  flutter_secure_storage: ^11.0.0

  # State management simple (ChangeNotifier + Provider/Consumer) : suffisant pour la
  # taille de l'application, pas de solution plus lourde (section 12).
  provider: ^6.1.2

  # Formatage de dates (Instant UTC backend -> affichage utilisateur local), sans
  # reimplementer un parseur ISO-8601 (section 35).
  intl: ^0.19.0

  # Ouvrir/partager un fichier deja telecharge (justificatif PDF, preuve de
  # paiement) avec les apps du systeme — le SDK Flutter seul ne le permet pas
  # (section 28 : preparer une UX de partage/ouverture reelle).
  share_plus: ^13.3.0

  # Ouvrir un fichier telecharge dans le lecteur systeme. Reserve au code QR
  # fournisseur (image) depuis oct. 2026 -- pour le recu/la proforma (PDF),
  # voir `printing` plus bas : open_filex s'est revele non fiable pour les
  # PDF sur iOS (retour client : "on arrive pas a voir les recus PDF ou
  # proforma au niveau d'iOS"). Repli sur share_plus seulement si aucun
  # lecteur n'est installe.
  open_filex: ^4.5.0

  # Repertoire temporaire ecrivable pour materialiser les octets telecharges
  # avant de les partager (share_plus a besoin d'un chemin de fichier reel).
  path_provider: ^2.1.5

  # Choisir une photo (preuve de paiement) depuis la galerie/l'appareil photo —
  # aucune API Flutter SDK ne le permet sans plugin (mission section 26).
  image_picker: ^1.1.2

  # Connexion "Continuer avec Google" (retour client : "c'est plus simple") —
  # ouvre le selecteur de compte natif et renvoie un jeton d'identite (ID
  # token), verifie cote backend par GoogleTokenVerifierService. Le SDK exige
  # une configuration native par plateforme (Client ID Android avec SHA-1
  # enregistre, GIDClientID + schema d'URL dans Info.plist iOS) : voir
  # DEPLOY.md. Sans configuration, GoogleAuthClient reste invoque mais
  # AppConfig.googleSignInAvailable vaut false et le bouton ne s'affiche pas.
  google_sign_in: ^6.2.2

  # Generation de PDF cote client (mission "differenciation marketing" : le
  # "Rapport d'activite" du profil PRO) — pur Dart, aucune dependance native
  # supplementaire au-dela de ce package.
  pdf: ^3.11.1

  # Affichage fiable d'un PDF deja telecharge (recu, proforma) via l'apercu
  # d'impression NATIF de chaque plateforme -- voir open_filex plus haut pour
  # le contexte (retour client oct. 2026). Meme editeur que le paquet pdf
  # ci-dessus.
  printing: ^5.15.0

  # Ouvrir WhatsApp (retour client sept. 2026 : "a partir de plus de 02
  # millions tu dois etre ramene sur WhatsApp pour confirmer ton ordre") --
  # lien https://wa.me/... via le navigateur/l'app, seul moyen standard
  # cross-plateforme d'ouvrir une conversation WhatsApp prereplie depuis
  # Flutter (aucune API SDK native ne le permet sans ce plugin).
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Genere les icones de lancement Android/iOS a partir d'une seule image
  # source (assets/icon/app_icon.png, meme logo que frontend/public/logo.jpeg
  # cote web) -- outil de build uniquement (dev_dependencies), jamais compile
  # dans l'application elle-meme. Regenerer apres tout changement de logo :
  # `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.3

# Genere les mipmap Android (toutes densites + Play Store 512x512) et
# l'AppIcon.appiconset iOS (toutes tailles requises, y compris 1024x1024 App
# Store) depuis la meme image source. Pas d'icone adaptative Android
# (foreground/background separes) : le logo porte deja son propre fond
# (carre arrondi navy), le decouper en calques necessiterait le fichier
# source original, indisponible ici.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
